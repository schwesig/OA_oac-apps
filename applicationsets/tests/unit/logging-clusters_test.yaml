suite: logging-clusters ApplicationSet
templates:
  - templates/managed/logging-clusters.yaml

tests:
  - it: should fail closed when hubName is not set
    asserts:
      - failedTemplate:
          errorPattern: hubName must be set

  - it: targets the logging-clusters placement with hub-wide then per-cluster values
    set:
      hubName: oac-dev-infra
    asserts:
      - equal:
          path: spec.generators[0].matrix.generators[0].clusterDecisionResource.labelSelector.matchLabels["cluster.open-cluster-management.io/placement"]
          value: logging-clusters
      - equal:
          path: spec.template.spec.source.helm.valueFiles[1]
          value: "/values/oac-dev-infra/{{name}}/{{component}}.yaml"

  - it: installs the store operator next to the collector
    set:
      hubName: oac-dev-infra
    asserts:
      - equal:
          path: spec.generators[0].matrix.generators[1].list.elements
          value:
            - component: loki-operator
            - component: cluster-logging

  - it: keeps resources when a cluster leaves the placement
    set:
      hubName: oac-dev-infra
    asserts:
      - equal:
          path: spec.syncPolicy.preserveResourcesOnDeletion
          value: true
