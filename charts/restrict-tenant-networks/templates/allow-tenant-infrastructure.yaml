apiVersion: policy.networking.k8s.io/v1alpha1
kind: AdminNetworkPolicy
metadata:
  name: allow-tenant-infrastructure
spec:
  priority: 50
  subject:
    namespaces:
      matchExpressions:
        - key: {{ .Values.tenantKey }}
          operator: Exists

  ingress:
  - name: "allow-system-ingress-to-tenants"
    action: Allow
    from:
    - namespaces:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
          - kube-system
          - openshift-monitoring
          - openshift-user-workload-monitoring
          - openshift-dns
          - openshift-ingress
          - openshift-apiserver
  # The Grafana operator reconciles Grafana resources inside the project
  # namespaces, so it has to reach the instance it manages. It builds that
  # address itself from the instance name and Grafana's own port, so the
  # project cannot redirect it, and the baseline policy denies cross-namespace
  # ingress, so without this rule the operator never gets in.
  - name: "allow-grafana-operator-ingress"
    action: Allow
    from:
    - namespaces:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
          - {{ .Values.grafanaOperatorNamespace }}
    ports:
    - portNumber:
        protocol: TCP
        port: {{ .Values.grafanaPort }}

  egress:
  - name: "allow-system-egress"
    action: Allow
    to:
    - namespaces:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
          - kube-system
          - openshift-dns
          - openshift-apiserver
  - name: "allow-shared-services-egress"
    action: Allow
    to:
    - namespaces:
        matchExpressions:
          - key: {{ .Values.sharedServiceKey }}
            operator: Exists
