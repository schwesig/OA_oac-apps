{{- /*
The same conversion acm-observability uses: COSI writes the bucket as one JSON
document, external-secrets reads it back through the API server and templates
the keys the Loki Operator expects. Loki rejects an endpoint without a scheme,
and pure-cosi hands out a bare host name.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki-bucket-reader
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loki-bucket-reader
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["bucketclaim-{{ .Values.lokiStack.name }}"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loki-bucket-reader
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: loki-bucket-reader
subjects:
  - kind: ServiceAccount
    name: loki-bucket-reader
    namespace: {{ .Values.namespace }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: loki-bucketconverter
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    kubernetes:
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: loki-bucket-reader
      remoteNamespace: {{ .Values.namespace }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.lokiStack.name }}-s3
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretStoreRef:
    name: loki-bucketconverter
    kind: SecretStore
  target:
    name: {{ .Values.lokiStack.name }}-s3
    template:
      data:
        bucketnames: {{ `{{ (.bucketInfo | fromJson).spec.bucketName }}` | quote }}
        endpoint: {{ `{{ $e := (.bucketInfo | fromJson).spec.secretS3.endpoint }}{{ if hasPrefix "http" $e }}{{ $e }}{{ else }}https://{{ $e }}{{ end }}` | quote }}
        access_key_id: {{ `{{ (.bucketInfo | fromJson).spec.secretS3.accessKeyID }}` | quote }}
        access_key_secret: {{ `{{ (.bucketInfo | fromJson).spec.secretS3.accessSecretKey }}` | quote }}
  data:
    - secretKey: bucketInfo
      remoteRef:
        key: bucketclaim-{{ .Values.lokiStack.name }}
        property: BucketInfo
